name: tidy
description: "Tidy: find duplicate, similar, blurry and junk photos and videos, and delete them by group."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: ../theme
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo-1024.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_background-1024.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground-1024.png"
